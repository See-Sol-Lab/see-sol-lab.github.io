<div class="title">System capability matrix for agent memory</div><div class="sub">Representative systems only · Values based on public documentation and source-available evidence · Colors indicate status, not desirability.</div><div class="rule"></div>
<div class="wrap"><table class="matrix"><thead><tr><th class="name"></th><th>Auto<br/>extract</th><th>Retrieve old<br/>memory</th><th>Update /<br/>merge</th><th>Delete /<br/>forget</th><th>Typed<br/>memory</th><th>Cross-session<br/>use</th><th>Needs developer<br/>workflow</th><th>Inspectable</th><th>Open<br/>source</th></tr></thead><tbody>
<tr><td class="name"><b>1. Mem0 V2</b><small>Overseas · memory framework</small></td><td class="yes">Yes</td><td class="yes">Yes</td><td class="yes">Yes</td><td class="yes">Yes</td><td class="partial">Partial</td><td class="yes">Yes</td><td class="no">No</td><td class="partial">Partial</td><td class="yes">Yes</td></tr>
<tr><td class="name"><b>2. Mem0 V3</b><small>Overseas · memory framework</small></td><td class="yes">Yes</td><td class="yes">Yes</td><td class="partial">Partial</td><td class="partial">Partial</td><td class="yes">Yes</td><td class="yes">Yes</td><td class="no">No</td><td class="yes">Yes</td><td class="yes">Yes</td></tr>
<tr><td class="name"><b>3. Letta / MemGPT</b><small>Overseas · stateful agent platform</small></td><td class="yes">Yes</td><td class="yes">Yes</td><td class="yes">Yes</td><td class="yes">Yes</td><td class="yes">Yes</td><td class="yes">Yes</td><td class="no">No</td><td class="yes">Yes</td><td class="yes">Yes</td></tr>
<tr><td class="name"><b>4. RAGFlow Memory</b><small>China · RAG + agent engine</small></td><td class="yes">Yes</td><td class="yes">Yes</td><td class="partial">Partial</td><td class="yes">Yes</td><td class="yes">Yes</td><td class="yes">Yes</td><td class="partial">Partial</td><td class="yes">Yes</td><td class="yes">Yes</td></tr>
<tr><td class="name"><b>5. MS-Agent</b><small>China · agent framework</small></td><td class="yes">Yes</td><td class="yes">Yes</td><td class="partial">Partial</td><td class="partial">Partial</td><td class="yes">Yes</td><td class="yes">Yes</td><td class="partial">Partial</td><td class="yes">Yes</td><td class="yes">Yes</td></tr>
<tr><td class="name"><b>6. Dify</b><small>China · agent / workflow platform</small></td><td class="no">No</td><td class="yes">Yes</td><td class="partial">Partial</td><td class="partial">Partial</td><td class="partial">Partial</td><td class="partial">Partial</td><td class="yes">Yes</td><td class="partial">Partial</td><td class="yes">Yes</td></tr>
<tr><td class="name"><b>7. Coze</b><small>China · managed agent platform</small></td><td class="unknown">Unknown</td><td class="partial">Partial</td><td class="unknown">Unknown</td><td class="unknown">Unknown</td><td class="partial">Partial</td><td class="partial">Partial</td><td class="yes">Yes</td><td class="no">No</td><td class="no">No</td></tr>
<tr><td class="name"><b>8. FastGPT</b><small>China · agent platform</small></td><td class="no">No</td><td class="yes">Yes</td><td class="no">No</td><td class="no">No</td><td class="partial">Partial</td><td class="partial">Partial</td><td class="yes">Yes</td><td class="partial">Partial</td><td class="yes">Yes</td></tr>
<tr><td class="name"><b>9. Model API baseline</b><small>DeepSeek / Kimi / Doubao / ERNIE / Hunyuan</small></td><td class="no">No</td><td class="partial">Partial</td><td class="no">No</td><td class="no">No</td><td class="no">No</td><td class="partial">Partial</td><td class="yes">Yes</td><td class="no">No</td><td class="partial">Partial</td></tr>
</tbody></table><aside class="side"><h3>What the matrix shows</h3><div class="point"><span class="sym">◉</span>True long-term memory routes automate extraction, retrieval, and later state revision.</div><div class="point"><span class="sym">◇</span>Many platforms expose memory-like behavior but depend heavily on developer-designed workflows.</div><div class="point"><span class="sym">▤</span>Model APIs usually provide context carryover or caching, not autonomous memory management.</div></aside></div>
<div class="legend"><div class="key"><span class="sw yes"></span><div><b>Yes</b>Capability is available and automated.</div></div><div class="key"><span class="sw partial"></span><div><b>Partial</b>Available in a limited or backend-dependent way.</div></div><div class="key"><span class="sw no"></span><div><b>No</b>Capability is not available.</div></div><div class="key"><span class="sw unknown"></span><div><b>Unknown</b>Not sufficiently verifiable.</div></div></div><div class="note">Unknown = mechanism not sufficiently verifiable from public materials.<br/><br/>Sources: product documentation, GitHub repositories, and public technical documentation.</div><div class="mark">SEE SOL LAB · GOUMANG × SOL · 2026</div>
