ne-height:1.38;margin:0}.stage.final{border:4px solid #087b79;background:#e9f6f3}.side{position:absolute;right:34px;top:22px;width:318px}.take,.breaks{border:3px solid #087b79;border-radius:20px;background:#f7fcfa;padding:20px 24px}.take h3,.breaks h3{font:700 27px Georgia,serif;margin:0 0 14px;padding-bottom:12px;border-bottom:2px solid #80bbb7}.take p{font-size:20px;line-height:1.38}.take strong{display:block;color:#087b79;font:700 36px/1.18 Georgia,serif;margin-top:12px}.breaks{margin-top:18px;border-color:#244c7b;background:#fbfcfe}.breaks h3{border-color:#8ca1bb;color:#173b69}.break{padding:12px 0;border-bottom:1px solid #a5b2c1;font-size:15px;line-height:1.35}.break:last-child{border:0}.break b{display:block;font-size:17px;margin-bottom:2px}.foot{position:absolute;left:80px;bottom:32px;width:980px;text-align:center;font:700 25px Georgia,serif;color:#18324f;border-top:2px solid #70aaa7;padding-top:14px}.mark{position:absolute;right:38px;bottom:22px;font-size:13px;letter-spacing:.12em;color:#6d7d88}
