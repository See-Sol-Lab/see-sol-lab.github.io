<div class="title">From storage to continuity:<br/>the memory lifecycle</div><div class="rule"></div><div class="sub">What many products call “memory” often stops at saving and retrieval. A fuller long-term memory system also decides what to keep, revises itself, forgets what no longer matters, and changes the next step.</div>
<div class="main"><div class="section-title"><span class="num">1</span>What the market often ships</div><div class="short"><div class="flow3"><div class="box"><div class="ico">▣</div><div><h4>Save</h4><p>Store information for later use.</p></div></div><div class="arrow">→</div><div class="box"><div class="ico">⌕</div><div><h4>Retrieve</h4><p>Find and recall information.</p></div></div><div class="arrow">→</div><div class="box"><div class="ico">➤</div><div><h4>Inject</h4><p>Insert it into the next prompt or context.</p></div></div></div><div class="short-note">Useful for persistence and prompt injection, but not enough for durable state continuity.</div></div>
<div class="section-title"><span class="num teal">2</span>A fuller long-term memory lifecycle</div><div class="life"><div class="flow8">
<div class="stage"><div class="n">1</div><h4>Discover</h4><div class="ico">⌕</div><p>Notice preferences, events, state changes, and unfinished intentions.</p></div>
<div class="stage"><div class="n">2</div><h4>Select</h4><div class="ico">▽</div><p>Choose what is worth keeping for future use.</p></div>
<div class="stage"><div class="n">3</div><h4>Write</h4><div class="ico">✎</div><p>Store structured memory with source, time, and attribution.</p></div>
<div class="stage"><div class="n">4</div><h4>Retrieve</h4><div class="ico">⌕</div><p>Recall at the relevant moment by meaning, entity, keyword, or time.</p></div>
<div class="stage"><div class="n">5</div><h4>Update</h4><div class="ico">↻</div><p>Revise older memories when new information conflicts or clarifies.</p></div>
<div class="stage"><div class="n">6</div><h4>Merge</h4><div class="ico">◎</div><p>Combine overlapping memories into a more stable entry.</p></div>
<div class="stage"><div class="n">7</div><h4>Forget</h4><div class="ico">⌫</div><p>Delete, decay, or archive outdated or low-value items.</p></div>
<div class="stage final"><div class="n">8</div><h4>Influence<br/>next step</h4><div class="ico">◎</div><p>Actually change the next answer, choice, or action.</p></div>
</div></div></div>
<div class="side"><div class="take"><h3>Core takeaway</h3><p>Not everything that gets saved will keep shaping the future.</p><strong>Memory is not duration;<br/>memory is continuity.</strong></div><div class="breaks"><h3>Where many systems break</h3><div class="break"><b>Discover / Select</b>Many systems store too much and judge too little.</div><div class="break"><b>Update / Merge</b>New facts pile up without repairing old state.</div><div class="break"><b>Forget</b>Most systems rely on crude FIFO or never forget at all.</div><div class="break"><b>Influence next step</b>Stored information is often never recalled when it matters.</div></div></div>
<div class="foot">Storage preserves the past. Memory changes the future.</div><div class="mark">SEE SOL LAB · GOUMANG × SOL · 2026</div>
</div></foreignObject></svg>