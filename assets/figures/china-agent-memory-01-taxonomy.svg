<div class="title">Five Levels of ‘Memory’ in China’s Agent Ecosystem</div><div class="rule"></div><div class="sub">A practical taxonomy of what “memory” means across agent products and frameworks. Representative examples only; not exhaustive.</div>
<div class="steps">
<div class="step s1"><div class="badge">1<div class="icon">◉</div></div><div class="body"><div class="head">True automatic memory classifiers</div><div class="desc">Automatically extract, evaluate, update, merge, or forget information; memory can meaningfully affect later behavior.</div><div class="examples"><b>Examples:</b> Mem0 V2/V3 · Letta / MemGPT · RAGFlow Memory · MS-Agent</div></div></div>
<div class="step s2"><div class="badge">2<div class="icon">◇</div></div><div class="body"><div class="head">Developer-orchestrated memory workflows</div><div class="desc">Memory-like behavior exists, but the logic is mainly designed and routed by developers rather than managed autonomously.</div><div class="examples"><b>Examples:</b> Dify workflows · Coze variables · FastGPT variables · customer-profile fields</div></div></div>
<div class="step s3"><div class="badge">3<div class="icon">▤</div></div><div class="body"><div class="head">Session summaries / context compression</div><div class="desc">Compresses dialogue history or preserves context for efficiency, but does not by itself form actively managed long-term memory.</div><div class="examples"><b>Examples:</b> Dify summaries · MS-Agent condensers · long context + context cache</div></div></div>
<div class="step s4"><div class="badge">4<div class="icon">⌕</div></div><div class="body"><div class="head">Knowledge-base / RAG systems</div><div class="desc">Retrieves external information and documents, but retrieval is not the same as the agent itself remembering.</div><div class="examples"><b>Examples:</b> Dify / FastGPT / RAGFlow · MaxKB · QAnything · Ark Knowledge Search</div></div></div>
<div class="step s5"><div class="badge">5<div class="icon">◁</div></div><div class="body"><div class="head">‘Memory’ as product rhetoric</div><div class="desc">The word is used broadly in product messaging, while the actual extraction, update, or forgetting mechanism remains opaque or unverified.</div><div class="examples"><b>Examples:</b> app-side “memory” features · opaque managed-platform memory</div></div></div>
</div>
<div class="call"><h3>Core takeaway</h3><p>True long-term memory is not just storing more context. It is deciding what deserves to survive and continue shaping the next step.</p></div>
<div class="source">Based on public documentation and source-available evidence.</div><div class="mark">SEE SOL LAB · GOUMANG × SOL · 2026</div>
